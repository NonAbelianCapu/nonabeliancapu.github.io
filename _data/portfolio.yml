research:
  - title: Interpretable surrogates of agent-based models
    focus: "Agent-based models are expensive to run and hard to read. I learn sparse differential equations (SINDy) whose coefficients depend on the model's micro parameters, so the macro dynamics can be read off, differentiated and calibrated."
    highlights:
      - "Paper at the 2026 Winter Simulation Conference; poster and tutorial at NetSci-X 2027."

  - title: Nowcasting with high-frequency data
    focus: "Machine-learning nowcasts of economic activity from more than 1,200 daily banking variables and official statistics, in production at Banco Provincia as PulsoPBA."
    highlights:
      - "Papers in <em>Estudios Económicos</em> and at ASAID (55th JAIIO)."

