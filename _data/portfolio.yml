tagline: PhD student at UBA-CONICET working on agent-based models of economic systems, interpretable surrogates of simulations and nowcasting with high-frequency data.
summary:
  - I am a CONICET doctoral fellow at the Institute of Computer Science (ICC, UBA-CONICET), working in <a href="https://sedlab.dc.uba.ar/" target="_blank" rel="noreferrer">SEDLab</a>, the Discrete Event Simulation Lab, with Rodrigo Castro and Sebastián Uchitel.
  - I build agent-based models of economic systems and the tools to study them, such as interpretable surrogates learned from simulations, calibration methods that tolerate noise, and machine learning on high-frequency data. I trained as a physicist at the National University of La Plata.

